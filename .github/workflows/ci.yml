name: Validate domi

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Run build, privacy and unit checks
        run: npm run check

      - name: Prepare browser for interface regression tests
        run: npx playwright install chromium

      - name: Verify chat and editor table rendering
        run: npm run test:markdown-tables

      - name: Verify Skill Hub creation, import and sidebar layout
        run: npm run test:skill-hub-ui
