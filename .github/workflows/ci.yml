name: Validate domi

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Run build, privacy and unit checks
        run: npm run check

      - name: Check out current public plugin for contract verification
        uses: actions/checkout@v4
        with:
          repository: 1DeepSheep/domi-plugin
          ref: main
          path: build/contract-plugin
          persist-credentials: false

      - name: Keep plugin module scope independent of the Electron package
        run: mv build/contract-plugin "$RUNNER_TEMP/domi-plugin-contract"

      - name: Verify client and plugin receipts with real scripts
        env:
          DOMI_PLUGIN_CONTRACT_ROOT: ${{ runner.temp }}/domi-plugin-contract
        run: npm run test:plugin-contracts

      - name: Prepare browser for interface regression tests
        run: npx playwright install chromium

      - name: Verify chat and editor table rendering
        run: npm run test:markdown-tables

      - name: Verify Skill Hub creation, import and sidebar layout
        run: npm run test:skill-hub-ui
